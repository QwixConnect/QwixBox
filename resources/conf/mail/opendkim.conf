# Managed by the QwixBox installer.
#
# Signs outbound mail for one domain. Deliberately not using KeyTable/SigningTable: this host
# sends as a single address (SMTP_FROM) on behalf of every tenant, so there is exactly one
# signing domain. Multiple domains would need those tables and a key per domain.

Syslog                  yes
SyslogSuccess           yes
LogWhy                  no

# Sign only. This host never receives mail, so there is nothing inbound to verify - and running
# a verifier costs DNS lookups on every message for an answer nobody reads.
Mode                    s

Canonicalization        relaxed/simple
Domain                  @MAIL_DOMAIN@
Selector                @DKIM_SELECTOR@
KeyFile                 /etc/opendkim/keys/@MAIL_DOMAIN@/@DKIM_SELECTOR@.private

# Sign as this host, and refuse to sign for anything else.
SubDomains              no
OversignHeaders         From

UserID                  opendkim
PidFile                 /run/opendkim/opendkim.pid

# The socket lives inside Postfix's queue directory because Debian's Postfix runs chrooted: a
# socket anywhere else is simply not visible to it, and mail then flows unsigned with only a
# "connect failed" line in the log. main.cf refers to it as local:/opendkim/opendkim.sock,
# which is this path relative to the chroot root.
Socket                  local:/var/spool/postfix/opendkim/opendkim.sock

# 002 leaves the socket group-writable so the postfix user - added to the opendkim group by the
# step - can connect to it.
UMask                   002
