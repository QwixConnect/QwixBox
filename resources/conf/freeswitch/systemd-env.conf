# Managed by the Qwixbox installer.
#
# The Lua handler reads these from the environment rather than having them baked into a script,
# so a credential rotation does not mean editing code.
[Service]
Environment=QWIXBOX_PG_DSN=pgsql://host=@DB_HOST@ port=@DB_PORT@ dbname=qwixbox user=@API_USER@ password=@API_DB_PASSWORD@
Environment=QWIXBOX_KAM_EGRESS=@FS_HOST@:@KAM_EGRESS_PORT@
Environment=QWIXBOX_API_BASE=@API_BASE_URL@
Environment=QWIXBOX_FS_GATEWAY_SECRET=@FS_XML_GATEWAY_SECRET@
Environment=QWIXBOX_FAX_SPOOL=@FAX_SPOOL@
